# FH Planet — GitLab CI (fully automatic; no manual steps or prompts)
# Every push runs validate. Every push to main also deploys automatically,
# to Cloudflare Pages and/or the SSH server, once their CI/CD variables are set.
#
# IMPORTANT: Do NOT modify HTTPS/SSL settings, certificates, domains, DNS,
# Caddy config, or Cloudflare zone/custom-domain settings from this pipeline.
# The deploy jobs only upload static files from dist/ and never touch HTTPS.
#
# The Finance module lives in its own finance/ folder and is opened from a
# module launcher card on the main index.html. No iframe is used, and the
# CI/deployment does not depend on one.
#
# No tokens or keys belong in this file.

stages:
  - validate
  - deploy

validate:
  stage: validate
  image: node:20-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - node scripts/selfcheck.js
    - sh scripts/stage-public.sh
    - test -f dist/index.html
    - test -f dist/finance/index.html
    - test -f dist/finance/css/app.css
    - test -f dist/finance/js/app.js
    - test -f dist/dash.html
    - test ! -f dist/app.py
    - test ! -f dist/fhplanet-reports.service
    - if grep -RIn --include='*.html' --include='*.js' --include='*.css' --include='*.md' -e "FS Organization" -e "FS Academy" . ; then echo "Use FH Organization, FH Academy, and FH Planet."; exit 1; fi
  artifacts:
    name: fh-planet-dist
    paths:
      - dist/
    expire_in: 14 days

deploy_cloudflare_pages:
  stage: deploy
  image: node:20-bookworm
  needs:
    - job: validate
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID
  script:
    - sh scripts/deploy-cloudflare.sh
  environment:
    name: production
    url: https://${CF_PAGES_PROJECT:-fh-planet-dashboard}.pages.dev

deploy_ssh_server:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: validate
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SSH_PRIVATE_KEY
      when: on_success
  before_script:
    - apk add --no-cache openssh-client rsync tar
  script:
    - sh scripts/deploy-ssh.sh
